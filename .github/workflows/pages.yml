name: Deploy SIGNAL//5 to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the distribution
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify the public surface
        shell: bash
        run: |
          set -euo pipefail
          test -f site/index.html
          test -f site/.nojekyll
          test -f site/robots.txt
          grep -q 'noindex, nofollow, noarchive' site/index.html
          grep -q '^Disallow: /$' site/robots.txt
          test ! -e site/assets/iphone
          test ! -e site/assets/android
          test ! -e site/assets/status
          test -z "$(find site -type f -name '*.map' -print -quit)"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
